<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Referee 🏆 - Smart Comparison Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .comparison-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #4facfe;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .results {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .score-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .score-table th,
        .score-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        
        .score-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        
        .score-table tr:hover {
            background: #f8f9fa;
        }
        
        .score {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
        }
        
        .score.high { background: #28a745; }
        .score.medium { background: #ffc107; color: #333; }
        .score.low { background: #dc3545; }
        
        .recommendation {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .recommendation h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .pros, .cons {
            margin: 10px 0;
        }
        
        .pros::before { content: "✅ "; }
        .cons::before { content: "❌ "; }
        
        .winner {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .winner h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 The Referee</h1>
            <p>Smart comparison tool that helps you make informed decisions by analyzing trade-offs</p>
        </div>
        
        <div class="content">
            <div class="comparison-form">
                <h2>Compare Options</h2>
                <form id="comparisonForm">
                    <div class="form-group">
                        <label for="comparisonType">What would you like to compare?</label>
                        <select id="comparisonType" required>
                            <option value="">Select comparison type...</option>
                            <option value="framework">JavaScript Frameworks</option>
                            <option value="cloud">Cloud Services</option>
                            <option value="api">API Approaches</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="options">Options to compare (comma-separated):</label>
                        <input type="text" id="options" placeholder="e.g., React, Vue, Angular" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="constraints">Criteria to evaluate (comma-separated):</label>
                        <input type="text" id="constraints" placeholder="e.g., learning-curve, performance, ecosystem" required>
                    </div>
                    
                    <button type="submit" class="btn">⚖️ Analyze Trade-offs</button>
                </form>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing trade-offs...</p>
            </div>
            
            <div class="results" id="results">
                <!-- Results will be populated here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
